name: PetroNet — иргэний эрх ба ваучер
description: |
  Нэвтэрсэн иргэний зүгээс: өнөөдрийн эрх юу вэ, ваучер нь юу байна.

  Ваучер үүсгэх алхам ЗӨВХӨН эрх байгаа үед л утгатай бөгөөд эрх нь бодлого,
  тухайн өдрийн нөөцөөс хамаарна. Тиймээс энэ сценари ваучер үүсгэхийг
  амжилтын нөхцөл болгодоггүй: 201 (үүссэн) ба 409/422 (эрх алга) хоёулаа
  системийн зөв хариу. Робот бодлогын шийдвэрийг «унасан» гэж дуудах ёсгүй.
auth: tenant
steps:
  - name: Өнөөдрийн эрх
    path: /api/v1/petro/me/entitlement
    expect:
      status: 200

  - name: Миний ваучерууд
    path: /api/v1/petro/me/vouchers
    expect:
      status: 200

  - name: Ваучер хүсэх
    method: POST
    path: /api/v1/petro/me/vouchers
    body:
      fuel_type: "ai92"
    expect:
      status: [200, 201, 400, 409, 422]
