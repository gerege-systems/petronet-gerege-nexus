name: PetroNet — хяналтын хаалга
description: |
  Зохицуулагчийн замууд ЖИРИЙН байгууллагад хаалттай байх ёстой. Энэ сценари
  түүнийг эсрэгээр нь шалгана: гишүүнээр нэвтэрсэн хэрнээ хяналтын дэлгэц рүү
  хүрвэл 403 ирэх ёстой.

  Яагаад эерэг биш сөрөг тест вэ: хяналтын эрх нь SQL доторх бодлого
  (`petro_is_oversight()`) бөгөөд түүнийг зөрчсөн өдөр аль ч ААН улсын бүх
  нэгтгэлийг уншина. Тийм зөрчил чимээгүй байдаг — хэн ч гомдоллохгүй, зүгээр
  л илүү өгөгдөл харагдана. Тиймээс хаалт хаалттай хэвээр байгааг тогтмол
  шалгах нь эерэг замыг шалгахаас илүү үнэ цэнэтэй.

  Зохицуулагчийн ТАЛААС нь шалгах сценари тусдаа бөгөөд хяналтын байгууллагын
  гишүүн шаардана — тэр нь энэ суулгац дээр АМГТГ.
auth: tenant
steps:
  - name: Хяналтын самбар хаалттай эсэх
    path: /api/v1/petro/oversight/dashboard
    expect:
      status: 403

  - name: Хамрах хүрээний цоорхой хаалттай эсэх
    path: /api/v1/petro/oversight/gaps
    expect:
      status: 403

  - name: Тулгалт хаалттай эсэх
    path: /api/v1/petro/oversight/reconciliation
    expect:
      status: 403

  - name: Хянах дараалал хаалттай эсэх
    path: /api/v1/petro/oversight/queue
    expect:
      status: 403

  - name: Өдрийн нэгтгэлийг дахин тооцох хаалттай эсэх
    method: POST
    path: /api/v1/petro/oversight/daily/refresh
    expect:
      status: 403

  # Техникийн тооллого нь ААН-ийн ӨӨРИЙН объектуудын тухай тул нээлттэй.
  # Энэ мөр нь дээрх таван 403 нь «бүх зүйл хаалттай» биш гэдгийг батална:
  # хаалга сонгож хаадаг, бүхэлдээ хаадаггүй.
  - name: Өөрийн тооллогын нэгтгэл нээлттэй эсэх
    path: /api/v1/petro/census/summary
    expect:
      status: 200
