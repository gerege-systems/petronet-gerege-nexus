# PetroNet, as a Gerege Nexus distribution.
#
# Four services: postgres, the platform's migrations, this product's binary, and
# the platform's shell. There is no second migration history here — this
# repository has no schema of its own yet — and no redis: the core runs without
# one and nothing on this host needs a second thing to keep alive.
#
# Required environment (deploy/.env, copied there by deploy.sh):
#   PETRONET_POSTGRES_PASSWORD  this stack's own database
#   SSO_DEFAULT_CLIENT_SECRET   the platform refuses to start without it in
#                               production — see config.ValidateProduction
#   PUBLIC_ORIGIN               where this instance answers
#   WEB_IMAGE                   the core's published shell, on the commit that
#                               matches go.mod's core version
#
# THE PORTS ARE NOT FREE CHOICES AND ARE NOT THE CORE'S DEFAULTS. This stack
# shares a host with fuelnet.gerege.mn, whose backend already holds
# 127.0.0.1:8082 — the port the core's `snippets/nexus-oauth.conf` hardcodes —
# and 3008 / 5434. So this deployment publishes 5440 / 8098 / 3018 and its vhost
# writes the OIDC locations out itself instead of including that snippet.
# Including it would have quietly served the neighbour's discovery document
# from this product's domain.

name: petronet

services:
  postgres:
    image: postgres:16-alpine
    container_name: gerege_petronet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PETRONET_POSTGRES_PASSWORD:?PETRONET_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - gerege_petronet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${IMAGE:-petronet:latest}
    container_name: gerege_petronet_migrate
    # The platform's migrations, from the core version this product's go.mod
    # pins — the image carries both, so they cannot drift apart.
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:${PETRONET_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${IMAGE:-petronet:latest}
    container_name: gerege_petronet_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${PETRONET_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
      ENVIRONMENT: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://petronet.mn}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://petronet.mn}
      # nginx terminates TLS in front of this, so the forwarded client address
      # can be trusted — and the login rate limiter counts on it being real.
      TRUST_PROXY_HEADERS: "true"

      # The catalogue shipped in the image. File mode: an instance that pulled a
      # catalogue from a registry would be offering whatever that registry says
      # today rather than what this binary can actually run.
      APP_CATALOG_PATH: /app/catalog/apps.json
      APP_CATALOG_URL: ""

      # Its own issuer, and its own sign-in. This deployment identifies people
      # itself — no SSO_CLIENT_ISSUER — so every OAuth callback it mints points
      # at itself and /login asks here.
      SSO_DEFAULT_CLIENT_SECRET: ${SSO_DEFAULT_CLIENT_SECRET:?SSO_DEFAULT_CLIENT_SECRET is required}

      # What this deployment calls itself. The browser app is given the same
      # name and more below; these are halves of one setting, and a stack that
      # renames only one of them has a sign-in screen and an eID prompt
      # disagreeing about which product somebody is standing in front of.
      BRAND_NAME: ${BRAND_NAME:-}

      # The operator console's hostname. Both halves of the stack are told,
      # because both gate on it: the API answers 404 to a /api/platform/v1
      # request that arrived on any other name, and the shell answers 404 to
      # /cp. Empty in production means this deployment has no console at all.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}

      # Where the console reads this deployment's metrics. The service below,
      # over the compose network — never the published port, which is bound to
      # loopback for an operator with an SSH tunnel.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}

      # eID Mongolia, as this deployment's relying party.
      #
      # The pair is what turns the sign-in screen's eID card from a button that
      # answers "session could not be started" into a request on somebody's
      # phone: without them the client is built and refuses at the first call.
      # The name and the display text are not decoration — they are what the
      # citizen reads in the app before approving, and their defaults in the
      # core are the core's own product name, so a deployment that leaves them
      # empty asks people to approve a sign-in to something they never opened.
      #
      # The callback registered with eID for this RP must be exactly
      #   ${PUBLIC_ORIGIN}/auth/eid/callback
      # The platform refuses any other host or path before it ever calls out.
      EID_RP_UUID: ${EID_RP_UUID:-}
      EID_RP_SECRET: ${EID_RP_SECRET:-}
      EID_RP_NAME: ${EID_RP_NAME:-}
      EID_DISPLAY_TEXT: ${EID_DISPLAY_TEXT:-}
      EID_BASE_URL: ${EID_BASE_URL:-}
      # Canned identities. Unset already means "off" in production; written
      # here so that turning it on is a deliberate line in .env rather than a
      # thing that could happen by accident.
      EID_MOCK_MODE: ${EID_MOCK_MODE:-false}

      # The Gerege Core register, which the first-run wizard and the
      # organisation screen search by registration number. Without it those
      # screens are typed in by hand — which is how a deployment ends up
      # calling itself something the invoices do not. The URL defaults to
      # core.gerege.mn; only the token is a deployment's own.
      GEREGE_CORE_TOKEN: ${GEREGE_CORE_TOKEN:-}

      # No demo data in production. The seeded account has a published password.
      SEED_DEMO_DATA: "false"
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:8098:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The platform's own shell, unmodified — the core's published image rather
  # than a build of our own.
  #
  # A distribution does not fork the frontend: the sidebar and every module
  # screen are catalogue-driven, so the generic shell already renders whatever
  # this instance installs. WEB_IMAGE pins the core commit; keep it on the tag
  # that matches go.mod's core version.
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    container_name: gerege_petronet_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Where the shell asks, server-side, what this deployment is. The browser
      # never uses it: it asks its own origin (lib/apiBase.ts). A server has no
      # origin, which is the whole reason this exists.
      API_INTERNAL_URL: http://backend:8080/api/v1
      # The console's hostname again, and it must be the same value the API was
      # given: the shell decides from it whether a request is the console's or
      # the platform's, and a stack whose two halves disagree serves the
      # platform's pages on the console's address.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}
      # Read per request — see frontend/lib/brand.ts — so brand is a setting
      # rather than a build.
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_THEME_COLOR: ${BRAND_THEME_COLOR:-}
      BRAND_ICON_URL: ${BRAND_ICON_URL:-}
      BRAND_MASKABLE_ICON_URL: ${BRAND_MASKABLE_ICON_URL:-}
    ports:
      - "127.0.0.1:3018:3000"
    depends_on:
      backend:
        condition: service_healthy

  # The console's metrics, and nothing else.
  #
  # One target — this product's own API — because the console's queries carry
  # no job filter: sharing the neighbour's Prometheus would have shown two
  # products' traffic under this deployment's name. Small retention to match
  # the job: 15 days is longer than any question this screen answers.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: gerege_petronet_prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - gerege_petronet_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9092:9090"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gerege_petronet_postgres_data:
  gerege_petronet_prometheus_data:
