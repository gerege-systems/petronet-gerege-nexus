# PetroNet System — Prometheus.
#
# Нэг зорилготой: операторын консолын «Платформын эрүүл мэнд» дэлгэц PromQL
# асуулга явуулдаг тул хаа нэгтээ Prometheus байх ёстой. Хоосон бол тэр хэсэг
# «тохируулаагүй» гэж харагдана.
#
# Нэг л зорилт: энэ бүтээгдэхүүний өөрийн API. Хөрш дээр (fuelnet) бүтэн
# мониторингийн стек — Grafana, Loki, Tempo, alertmanager, гурван exporter —
# аль хэдийн ажиллаж байгаа ч түүнийг хуваалцвал консолын асуулгууд хоёр
# бүтээгдэгүүний хүсэлтийг нийлүүлж тоолно: `sum(rate(http_requests_total…))`
# гэдэгт job-ын шүүлт байхгүй. Хөршийн тоог өөрийн нэрээр үзүүлэхээс хоосон
# байсан нь дээр.
#
# Disk, санах ой, Postgres-ийн хэмжигдэхүүн энд алга: тэдгээрийг өгөх
# exporter-ууд хөршийн сүлжээнд, хөршийн сангийн ард байна. Консол тэр
# асуулга унасан үед хэсгийг нь орхидог тул дэлгэц худал тоо биш, дутуу
# хэсэгтэй харагдана. Хэрэгтэй болбол postgres_exporter нэмэх нь энэ файлын
# нэг блок.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: petronet

scrape_configs:
  - job_name: petronet_api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: api
