# PetroNet System — Prometheus.
#
# Нэг зорилготой: операторын консолын «Платформын эрүүл мэнд» дэлгэц PromQL
# асуулга явуулдаг тул хаа нэгтээ Prometheus байх ёстой. Хоосон бол тэр хэсэг
# «тохируулаагүй» гэж харагдана.
#
# Нэг л зорилт: энэ бүтээгдэхүүний өөрийн API. Урьд нь энэ хост дээр хөрш
# систем бүтэн мониторингийн стектэй ажиллаж байсан ч түүнийг хуваалцаагүй:
# консолын асуулгууд job-оор шүүдэггүй тул `sum(rate(http_requests_total…))`
# хоёр бүтээгдэхүүний хүсэлтийг нийлүүлж тоолох байв. Хөрш 2026-09-03-нд алга
# болсон бөгөөд одоо энэ стек өөрийн Prometheus-тай ганцаараа үлдэв — шийдвэр
# өөрчлөгдөөгүй, зүгээр л хуваалцах зүйл байхаа больсон.
#
# Гурван зорилт: энэ бүтээгдэхүүний API, хостын node_exporter, ба энэ
# системийн сангийн exporter. Redis энд байхгүй тул консолын тэр хэмжигдэхүүн
# хоосон хэвээр — байхгүй зүйлийг зурахаас хоосон байсан нь дээр.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: petronet

scrape_configs:
  - job_name: petronet_api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: api

  # Хостын диск, санах ой, CPU. Хөрш дээр node_exporter аль хэдийн ажилладаг ч
  # түүний порт нь 127.0.0.1 дээр уягдсан бөгөөд контейнерээс хостын loopback
  # руу хүрэх зам байхгүй. Тиймээс өөрийнхөө нэгийг ажиллуулна: хэмжилт нь
  # ижил хостынх тул тоо нь ижил, харин зам нь энэ стекийн дотор үлдэнэ.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Энэ системийн сангийн холболт, хэмжээ. Консолын «Дэд бүтэц» хэсгийн
  # postgres_connections хэмжигдэхүүн эндээс ирнэ.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
