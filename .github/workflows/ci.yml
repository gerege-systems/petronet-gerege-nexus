# What has to be true before this repository's main moves.
#
# The core has its own CI; this one is about the half that lives here — the
# modules this repository will carry and the image that ships them. It exists
# from the first commit because the failure it catches is the one a distribution
# is most exposed to: go.mod pointing at a working copy, or a catalogue that
# disagrees with the binary. Neither is visible on the laptop that wrote it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Модулийн интеграцийн тестүүд бодит Postgres шаарддаг бөгөөд байхгүй бол
    # ЧИМЭЭГҮЙ skip болдог: `go test` ногоон, гэтэл мөрийн түвшний тусгаарлалт,
    # дөрвөн нүд, хэш гинж, CHECK хязгаарууд — өөрөөр хэлбэл кодын салааг
    # харж шалгах боломжгүй яг тэр дүрмүүд — огт ажиллаагүй байна. Ваучерын
    # cross-tenant алдаа (00014) яг ийм байдлаар main дээр амьдарсан.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Прод кластер Улаанбаатарын цагаар ажилладаг (deploy/docker-compose.yml).
          # CURRENT_DATE-ийг долоон газар хэрэглэдэг тул тест ч мөн адил байх ёстой.
          TZ: Asia/Ulaanbaatar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/platform_db?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The toolchain comes from go.mod, so it cannot drift from what the
          # code is written against.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Схемийг байрлуулах нь хоёр алхам, яг байрлуулалт дээрхтэй адил:
      # цөмийн түүх өөрийн хүснэгтэд, модулийн түүх `goose_db_version_petro`-д
      # (appinstall-ийн нэрлэх дүрэм: апп id-гийн сүүлийн хэсэг). Хоёр дуудлага
      # тусдаа холболт үүсгэдэг нь бас чухал: цөмийн 00080 нь өгөгдлийн сангийн
      # `search_path`-ийг `tenant, platform` болгодог ба модулийн угтваргүй
      # хүснэгтүүд түүний ачаар зөв plane-д унана.
      - name: Миграцын хөтлөгч
        run: |
          go build -o /tmp/migrate github.com/gerege-systems/open-gerege-nexus/backend/cmd/migrate
          echo "CORE_DIR=$(go list -m -f '{{.Dir}}' github.com/gerege-systems/open-gerege-nexus/backend)" >> "$GITHUB_ENV"
      - name: Платформын схем
        run: MIGRATIONS_DIR="$CORE_DIR/db/migrations" /tmp/migrate up
      - name: Модулийн схем
        run: |
          MIGRATIONS_DIR=modules/petro/migrations \
          MIGRATIONS_TABLE=goose_db_version_petro \
          /tmp/migrate up

      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

      # Тест DB-тэй болсны дараа skip нь ногоон CI-гийн доор нуугдаж чадна.
      # Хамгийн хямд хамгаалалт: интеграцийн тестүүд үнэхээр ажилласан эсэхийг
      # нэрээр нь асуух.
      - name: Интеграцийн тест ажилласан эсэх
        run: |
          go test -count=1 -run TestOnlyASupervisoryBodySeesAnotherCompanysReport \
            -v ./modules/petro/ | tee /tmp/rls.log
          grep -q -- "--- PASS: TestOnlyASupervisoryBodySeesAnotherCompanysReport" /tmp/rls.log \
            || { echo "RLS тест ажиллаагүй — DATABASE_URL хүрсэнгүй юү?"; exit 1; }

  image:
    name: Image
    runs-on: ubuntu-latest
    # The deployable artefact, built exactly as deploy.sh builds it. This is the
    # job that catches an absolute `replace` in go.mod, and a catalogue merge
    # that drops one of this repository's apps — the Dockerfile fails the build
    # rather than letting an instance start with a binary carrying an app its
    # catalogue does not name.
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t petronet:ci -f deploy/Dockerfile .

  web:
    name: Fuel web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: docker build
        working-directory: ${{ github.workspace }}
        run: docker build -t petronet-web:ci frontend

  scenarios:
    name: Тест сценари
    runs-on: ubuntu-latest
    # Тохиргоог ЖОБЫН env рүү нэг удаа буулгана. Шалтгаан нь GitHub-ийн дүрэм:
    # `secrets` контекстийг алхмын `if`-д ашиглаж БОЛДОГГҮЙ — workflow нь
    # ажил эхлэхээс өмнө «workflow file issue» гэж унана. `env` бол зөвшөөрөгдөнө,
    # тиймээс нөхцөлүүд доор `env.…` уншина.
    env:
      TSM_URL: ${{ vars.TSM_URL }}
      TSM_PASSWORD: ${{ secrets.TSM_PASSWORD }}
      TSM_GH_TOKEN: ${{ secrets.TSM_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Сценарийн ХЭЛБЭР — нууц, сүлжээ, TSM гурвуулангүйгээр. Энэ нь PR бүр
      # дээр, fork-оос ирсэн PR дээр ч ажиллана.
      #
      # Өмнө нь энэ ажил `go install …/tsm-gerege-mn` -ээр эхэлдэг байсан бөгөөд
      # тайлбарт нь «энэ бол нууц шаарддаггүй шалгалт» гэж бичсэн байв. Хоёулаа
      # худал: `tsm` нь ХААЛТТАЙ репод байдаг тул татахад л токен хэрэгтэй, ба
      # бинарь суулгах нь сценариудын талаар юу ч шалгадаггүй. Үр дүнд нь ажил
      # PR бүр дээр унаж, «Тест сценари» гэдэг улаан нь ердийн зүйл болж, хэн ч
      # хардаггүй болсон байв. Одоо шалгалт нь жинхэнэ: YAML задарч байна уу,
      # `name`/`path` бий юу, `auth` танигдах утга мөн үү, `expect.status` нь
      # HTTP код мөн үү.
      - name: Сценарийн хэлбэр
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 .github/scripts/check-scenarios.py tsm/

      # Доорх бүхэн нь ТАРААЛТ, шалгалт биш — тиймээс зөвхөн main дээр, бүх
      # тохиргоо бүрэн үед. Аль нэг нь дутуу бол чимээгүй алгасана
      # (`tsm/README.md`-ийн дүрэм).
      #
      # `TSM_GH_TOKEN` нь ХААЛТТАЙ `tsm-gerege-mn`-ийг татах эрх — зөвхөн
      # Contents:read. Түүнгүйгээр `go install` нь «could not read Username»
      # гэж унадаг: fork-ийн PR-д нууц олгогддоггүй тул энэ нөхцөл тэнд
      # хэзээ ч үнэн болохгүй, тэр нь зөв.
      - uses: actions/setup-go@v7
        if: ${{ github.ref == 'refs/heads/main' && env.TSM_URL != '' && env.TSM_GH_TOKEN != '' }}
        with:
          go-version: "1.26"

      - name: tsm суулгах
        if: ${{ github.ref == 'refs/heads/main' && env.TSM_URL != '' && env.TSM_GH_TOKEN != '' }}
        run: |
          git config --global \
            url."https://x-access-token:$TSM_GH_TOKEN@github.com/".insteadOf "https://github.com/"
          GOPRIVATE='github.com/gerege-systems/*' \
            go install github.com/gerege-systems/tsm-gerege-mn@latest

          bin="$(go env GOPATH)/bin"
          # `go install` нь бинарийг МОДУЛИЙН нэрээр тавьдаг: `tsm-gerege-mn`.
          # Баримт бичиг ба доорх алхмууд бүгд `tsm` гэж дууддаг — хүн локал
          # дээр өөрөө alias хийдэг. CI-д тэр нэрийг энд өгнө.
          ln -sf "$bin/tsm-gerege-mn" "$bin/tsm"
          # `setup-go` нь GOPATH/bin-ийг PATH-д НЭМДЭГГҮЙ.
          echo "$bin" >> "$GITHUB_PATH"
          # Суулгалт бүтсэн эсэхийг ЭНД хэлнэ. Үгүй бол дараагийн алхам
          # `tsm: command not found` (exit 127) гэж унах бөгөөд тэр мессеж нь
          # юу болсныг хэлдэггүй — суулгах алхам ногоон харагдсаар байдаг.
          test -x "$bin/tsm" || { echo "tsm суулгагдсангүй:" >&2; ls -l "$bin" >&2; exit 1; }

      # main дээр, нууц тавигдсан үед л түлхэнэ. Сценари бол аппын өмч тул
      # тэдгээр TSM руу гараар биш, кодтойгоо хамт очно: шинэ API зам нэмсэн
      # PR merge болмогц түүний сценари ажиллах байрандаа очсон байна.
      - name: TSM руу түлхэх
        if: ${{ github.ref == 'refs/heads/main' && env.TSM_URL != '' && env.TSM_GH_TOKEN != '' }}
        run: tsm push tsm/

      # Утааны сценари нь юу ч үүсгэдэггүй тул байрлуулалт бүрийн дараа
      # ажиллуулах нь аюулгүй. Өгөгдөл үүсгэдэг сценариудыг CI ажиллуулахгүй:
      # тэдгээр нь продакшн дээр бичдэг бөгөөд тэр шийдвэр хүнийх.
      - name: Утааны сценари
        if: ${{ github.ref == 'refs/heads/main' && env.TSM_URL != '' && env.TSM_GH_TOKEN != '' }}
        run: tsm run petronet-smoke petronet
