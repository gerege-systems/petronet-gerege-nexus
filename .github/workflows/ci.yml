# What has to be true before this repository's main moves.
#
# The core has its own CI; this one is about the half that lives here — the
# modules this repository will carry and the image that ships them. It exists
# from the first commit because the failure it catches is the one a distribution
# is most exposed to: go.mod pointing at a working copy, or a catalogue that
# disagrees with the binary. Neither is visible on the laptop that wrote it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The toolchain comes from go.mod, so it cannot drift from what the
          # code is written against.
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  image:
    name: Image
    runs-on: ubuntu-latest
    # The deployable artefact, built exactly as deploy.sh builds it. This is the
    # job that catches an absolute `replace` in go.mod, and a catalogue merge
    # that drops one of this repository's apps — the Dockerfile fails the build
    # rather than letting an instance start with a binary carrying an app its
    # catalogue does not name.
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t petronet:ci -f deploy/Dockerfile .

  web:
    name: Fuel web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: docker build
        working-directory: ${{ github.workspace }}
        run: docker build -t petronet-web:ci frontend

  scenarios:
    name: Тест сценари
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # Түлхэхийн өмнө YAML нь зөв эсэхийг эндээс шалгана. PR дээр нууц байхгүй
      # тул түлхэхгүй — гэхдээ эвдэрсэн сценари main руу орох ёсгүй, ба тэр нь
      # нууц шаарддаггүй шалгалт.
      - name: tsm суулгах
        run: go install github.com/gerege-systems/tsm-gerege-mn@latest

      # main дээр, нууц тавигдсан үед л түлхэнэ. Сценари бол аппын өмч тул
      # тэдгээр TSM руу гараар биш, кодтойгоо хамт очно: шинэ API зам нэмсэн
      # PR merge болмогц түүний сценари ажиллах байрандаа очсон байна.
      - name: TSM руу түлхэх
        if: github.ref == 'refs/heads/main' && vars.TSM_URL != ''
        env:
          TSM_URL: ${{ vars.TSM_URL }}
          TSM_PASSWORD: ${{ secrets.TSM_PASSWORD }}
        run: tsm push tsm/

      # Утааны сценари нь юу ч үүсгэдэггүй тул байрлуулалт бүрийн дараа
      # ажиллуулах нь аюулгүй. Өгөгдөл үүсгэдэг сценариудыг CI ажиллуулахгүй:
      # тэдгээр нь продакшн дээр бичдэг бөгөөд тэр шийдвэр хүнийх.
      - name: Утааны сценари
        if: github.ref == 'refs/heads/main' && vars.TSM_URL != ''
        env:
          TSM_URL: ${{ vars.TSM_URL }}
          TSM_PASSWORD: ${{ secrets.TSM_PASSWORD }}
        run: tsm run petronet-smoke petronet
