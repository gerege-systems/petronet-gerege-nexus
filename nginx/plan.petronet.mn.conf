# plan.petronet.mn — PetroNet System-ийн төслийн баримт.
#
# Статик хуудас, өөрийн контейнерээс (deploy/docker-compose.yml, порт 3023).
# Хостод юу ч суулгахгүй: агуулга нь репод, шинэчлэх нь `git pull`.
#
# Хоёр урхи, хоёулаа хариу 200 хэвээр байхад чимээгүй ажилладаг (цөмийн
# docs/OPERATIONS.md):
#
#   1. `add_header` өв залгамжлахгүй — тиймээс бүгд нь server түвшинд, нэг ч
#      location блок дотор байхгүй.
#   2. Certbot HTTP/2 бичдэггүй — тиймээс `http2 on;` тусдаа заавраар.
#
# Суулгах (certbot-оос ӨМНӨ):
#   cp nginx/plan.petronet.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/plan.petronet.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d plan.petronet.mn
#
# ДАХИН ХУУЛАХАД БОЛГООМЖИЛ. Энэ файл дараа нь өөрчлөгдвөл дээрх `cp`-г
# дахин ажиллуулах нь certbot-ийн нэмсэн 443 блокийг арчина — домэйн
# HTTPS дээр бүтэн унана (nginx -t нь өнгөрнө: синтакс зөв, гэхдээ сонсох
# порт нь 80 л үлдсэн байна). Хуулсан бол дараа нь заавал:
#   certbot --nginx -d plan.petronet.mn --non-interactive --redirect

server {
    listen 80;
    server_name plan.petronet.mn;

    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        proxy_pass http://127.0.0.1:3023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
