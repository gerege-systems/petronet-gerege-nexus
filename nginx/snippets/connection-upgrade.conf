# WebSocket-ийн `Connection` толгойн зөв утга.
#
# vhost-ууд `proxy_set_header Connection $connection_upgrade;` гэж бичдэг ба
# энэ map нь тэр хувьсагчийг тодорхойлно. Өмнө нь бүгд `"upgrade"` гэж нөхцөлгүй
# бичсэн байсан: тэр нь websocket-д зөв боловч ЭНГИЙН хүсэлт бүр дээр upstream
# keepalive-ыг эвдэж, хүсэлт тутамд шинэ холболт нээлгэдэг (аудитын №46).
#
# `http` блок дотор орох ёстой тул /etc/nginx/conf.d/ дотор байрлана.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
