# monitor.petronet.mn — Grafana.
#
# Энэ хаягийн ард Grafana-гаас өөр юу ч байхгүй тул дэд зам биш, домэйны
# үндэс дээр үйлчилнэ: `GF_SERVER_SERVE_FROM_SUB_PATH` нь холбоос бүрийг
# дахин бичдэг тохиргоо бөгөөд шаардлагагүй үед асаах нь дэмий эрсдэл.
#
# Хоёр урхи, хоёулаа хариу 200 хэвээр байхад чимээгүй ажилладаг (цөмийн
# docs/OPERATIONS.md, «nginx-ийн хоёр урхи»):
#
#   1. `add_header` өв залгамжлахгүй — хүү блок дотор НЭГ ч байвал дээд
#      түвшнийхийг БҮГДИЙГ нь хаяна. Тиймээс энэ файлын бүх `add_header` нь
#      server түвшинд, location блок дотор нэг ч байхгүй.
#   2. Certbot HTTP/2 бичдэггүй — `listen 443 ssl` мөрийг өөрөө бичээд
#      протоколыг нэмдэггүй. Тиймээс `http2 on;` нь тусдаа заавар: гэрчилгээ
#      шинэчлэх бүрд алга болохгүй.
#
# Суулгах (certbot-оос ӨМНӨ):
#   cp nginx/monitor.petronet.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/monitor.petronet.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d monitor.petronet.mn

server {
    listen 80;
    server_name monitor.petronet.mn;

    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Ажиглалтын самбар нь хайлтын робот, урьдчилсан харагдац, frame-д
    # зориулагдаагүй.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live нь websocket ашиглана. Үүнгүйгээр самбар ачаалагдана
        # ч бодит цагийн панелиуд чимээгүй хөдөлгөөнгүй болно.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
